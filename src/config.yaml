# Processing parameters and output filenames. Dataset paths are intentionally
# kept in job.sh and passed to the Python scripts as command-line arguments.
# Stage 1 filenames support the ID placeholder shown below, while Stage 2
# filenames support {frames} and {variables}.
cmip:
  step1:
    imsize_x: 101
    imsize_y: 101
    interpolation_steps: 4
    timestep_hours: 6
    output_filename_template: WRF_STORMID_{storm_id}.nc

  step2:
    frames: 5
    sample_stride: 4
    var_levels:
      - U10m
      - V10m
      - SST
      - LANDMASK
      - U28
      - V28
      - U05
      - V05
      - T23
      - QVAPOR10
      - PHB10
      - PSFC
      - RAINNC
      - RAINC
    x_filename: cmip_{frames}f_{variables}v_X.npy
    z_filename: cmip_{frames}f_{variables}v_Z.npy
    storm_ids_filename: cmip_{frames}f_{variables}v_storm_ids.npy
    storm_lifetimes_filename: cmip_{frames}f_{variables}v_storm_lifetimes.npy
    chunk_start_frames_filename: cmip_{frames}f_{variables}v_chunk_start_frames.npy

idealize:
  step1:
    imsize_x: 101
    imsize_y: 101
    experiment_wrf:
      - exp_02km_m01
      - exp_02km_m02
      - exp_02km_m03
      - exp_02km_m04
      - exp_02km_m05
      - exp_02km_m06
      - exp_02km_m07
      - exp_02km_m08
      - exp_02km_m09
      - exp_02km_m10
      - exp_02km_u01
      - exp_02km_u02
      - exp_02km_u03
      - exp_02km_u04
      - exp_02km_u05
      - exp_02km_u06
      - exp_02km_u07
      - exp_02km_u08
      - exp_02km_u09
      - exp_02km_u10      
    x_resolution: d02
    output_filename_template: WRF_STORMID_{experiment_id}.nc

  step2:
    frames: 5
    sample_stride: 8
    var_levels:
      - U10m
      - V10m
      - SST
      - LANDMASK
      - U14
      - V14
      - U03
      - V03
      - T12
      - QVAPOR05
      - PHB05
    x_filename: ideal_{frames}f_{variables}v_X.npy
    z_filename: ideal_{frames}f_{variables}v_Z.npy
    experiment_ids_filename: ideal_{frames}f_{variables}v_experiment_ids.npy
    storm_lifetimes_filename: ideal_{frames}f_{variables}v_storm_lifetimes.npy
    chunk_start_frames_filename: ideal_{frames}f_{variables}v_chunk_start_frames.npy
